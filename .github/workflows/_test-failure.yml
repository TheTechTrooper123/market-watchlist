name: Test Fehlermeldung

# Temporärer Test: prüft, ob die Issue-Benachrichtigung bei Fehlschlägen greift.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fail:
    runs-on: ubuntu-latest
    steps:
      - name: Absichtlich fehlschlagen
        run: |
          echo "::error::Testfehler für die Issue-Benachrichtigung."
          exit 1

      - name: Fehlermeldung als Issue anlegen
        if: failure()
        uses: actions/github-script@v7
        env:
          TITLE: "Test: Fehlermeldung prüfen"
        with:
          script: |
            const title = process.env.TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const started = new Date().toISOString();
            const body = [
              `Testlauf fehlgeschlagen (**${started}**).`,
              "",
              `- Lauf: ${runUrl}`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Erneut fehlgeschlagen am ${started}: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
