name: Täglicher Screener

on:
  schedule:
    # Werktags 22:30 UTC — nach Handelsschluss in New York (21:00 UTC).
    # GitHub führt geplante Workflows nur vom Default-Branch aus und kann sie
    # bei Last um einige Minuten verzögern.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Börsen auslesen
        run: node scripts/screen.mjs

      - name: Daten plausibilisieren
        run: |
          set -euo pipefail
          companies=$(jq '.companies | length' data/watchlist.json)
          series=$(jq '.series | length' data/history.json)
          generated=$(jq -r '.generatedAt' data/watchlist.json)
          echo "Unternehmen: $companies"
          echo "Kursreihen: $series"
          echo "Erzeugt: $generated"
          {
            echo "### Screener-Lauf"
            echo ""
            echo "| Kennzahl | Wert |"
            echo "| --- | --- |"
            echo "| Unternehmen | $companies |"
            echo "| Kursreihen | $series |"
            echo "| Erzeugt | $generated |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Ein Einbruch dieser Zahlen bedeutet fast immer, dass Yahoo Finance
          # sein Antwortformat geändert hat oder uns drosselt.
          if [ "$companies" -lt 300 ]; then
            echo "::error::Nur $companies Unternehmen — erwartet werden mindestens 300."
            exit 1
          fi
          if [ "$series" -lt 300 ]; then
            echo "::error::Nur $series Kursreihen — erwartet werden mindestens 300."
            exit 1
          fi

      - name: Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "chore: Watchlist $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fehlermeldung als Issue anlegen
        if: failure()
        uses: actions/github-script@v7
        env:
          TITLE: Screener-Lauf fehlgeschlagen
        with:
          script: |
            const title = process.env.TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const started = new Date().toISOString();
            const body = [
              `Der tägliche Screener ist fehlgeschlagen (**${started}**, Auslöser: \`${context.eventName}\`).`,
              "",
              `- Lauf: ${runUrl}`,
              `- Branch: \`${context.ref}\``,
              "",
              "Häufige Ursachen: Yahoo Finance antwortet nicht im erwarteten Format oder drosselt die Requests.",
              "Nach der Korrektur neu starten: `gh workflow run screen.yml`.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Erneut fehlgeschlagen am ${started}: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Fehlermeldung schließen
        if: success()
        uses: actions/github-script@v7
        env:
          TITLE: Screener-Lauf fehlgeschlagen
        with:
          script: |
            const title = process.env.TITLE;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", per_page: 100,
            });
            for (const issue of open.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Wieder erfolgreich am ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: "closed",
              });
            }
